name: desktop

# Installers for the desktop app, each built on the platform it is for: the
# server's ripgrep is fetched for the machine it is installed on, so a Linux
# AppImage built on a Mac would search with a Mac binary. Run by hand, which
# leaves the installers on the run for a week, or by the release workflow,
# which puts them on the GitHub release where they stay.
on:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14 # Apple Silicon
            flags: --mac
          - os: macos-15-intel # Intel; macos-13 is retired
            flags: --mac
          - os: windows-latest
            flags: --win
          - os: ubuntu-latest
            flags: --linux
    runs-on: ${{ matrix.os }}
    env:
      # the client's vite build outgrows Node's default ~2 GB heap now and then
      # (it ran a macOS installer build out of memory for v0.1.0)
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      # the version is package.json's packageManager; naming one here as
      # well is refused, even when the two agree
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node desktop/scripts/stage.mjs
      - run: pnpm --filter @stickie/desktop exec electron-builder --config electron-builder.json ${{ matrix.flags }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: stickie-${{ matrix.os }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.exe
            desktop/release/*.AppImage
          if-no-files-found: error
          # four installers are ~450 MB a run; kept long enough to fetch, not
          # long enough to fill a free account's artifact storage
          retention-days: 7
